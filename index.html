  <style>
    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Print styling optimization */
    @media print {
      html, body, #root, #root > div {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        position: static !important;
        display: block !important;
      }
      
      /* Reset all nested containers to allow page breaking */
      div, main, aside, section {
        overflow: visible !important;
        height: auto !important;
        max-height: none !important;
        display: block !important;
        position: static !important;
      }

      /* Preserves flex/grid layouts during print */
      .print-grid {
        display: grid !important;
      }
      .print-flex {
        display: flex !important;
      }
      
      body {
        background-color: white !important;
        color: black !important;
      }
      
      .no-print {
        display: none !important;
      }
      
      .print-area {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        display: block !important;
        overflow: visible !important;
        height: auto !important;
        position: static !important;
      }
    }
  </style>

const getCurrentDateTimeString = () => {
  const d = new Date();
  const weekDays = ['일', '월', '화', '수', '목', '금', '토'];

  const month = String(d.getMonth() + 1).padStart(2, '0');
  const date = String(d.getDate()).padStart(2, '0');
  const day = weekDays[d.getDay()];
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  return `${year}년 ${month}월 ${date}일(${day}) ${hours}:${minutes}`;
};

const parseAttendeesToSignatures = (text, chairText) => {
  if (!text) return '';
  const chairName = getChairpersonName(chairText);
  const secName = getSecretaryName(text);
  const parts = text.split(',');
  const names = parts.map(part => {
    let clean = part.trim();
    if (!clean) return '';
    clean = clean.replace(/\(.*?\)/g, '').trim();
    const tokens = clean.split(/\s+/);
    const name = tokens[tokens.length - 1];
    return name ? `${name}(인)` : '';
  }).filter(Boolean);

  // Ensure chairperson is included at the beginning
  if (chairName) {
    const chairSig = `${chairName}(인)`;
    const alreadyExists = names.some(n => n.includes(chairName));
    if (!alreadyExists) {
      names.unshift(chairSig);
    }
  }
  // Ensure secretary is included
  if (secName) {
    const cleanSecSig = `${secName}(인)`;
    const alreadyExists = names.some(n => n.includes(secName));
    if (!alreadyExists) {
      names.push(cleanSecSig);
    }
  }
  return names.join(', ');
};
