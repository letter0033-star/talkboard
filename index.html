    // Resolve Lucide icons from vanilla lucide global variable to avoid React race conditions
    const createLucideReactIcon = (iconName) => {
      return (props) => {
        const svgRef = useRef(null);
        useEffect(() => {
          if (svgRef.current && window.lucide) {
            // Create the icon node using lucide library
            const iconNode = window.lucide.icons[iconName];
            if (iconNode) {
              // Clear previous children
              svgRef.current.innerHTML = '';
              // Create SVG attributes
              const svg = svgRef.current;
              const attrs = iconNode[1];
              Object.entries(attrs).forEach(([key, value]) => {
                svg.setAttribute(key, value);
              });
              // Append paths
              const paths = iconNode[2];
              paths.forEach(([tagName, tagAttrs]) => {
                const child = document.createElementNS('http://www.w3.org/2000/svg', tagName);
                Object.entries(tagAttrs).forEach(([k, v]) => {
                  child.setAttribute(k, v);
                });
                svg.appendChild(child);
              });
            }
          }
        }, []);

        const size = props.size || 24;
        const className = props.className || '';
        return (
          <svg
            ref={svgRef}
            width={size}
            height={size}
            className={className}
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"

        );
      };

    const getSecretaryName = (text) => {

      const parts = text.split(',');

        let clean = part.trim();
        if (clean.includes('간사')) {
          clean = clean.replace(/\(.*?\)/g, '').trim();
          const tokens = clean.split(/\s+/);
          return tokens[tokens.length - 1] || '정선아';
        }

      return '정선아';
    };

      return tokens[tokens.length - 1] || '';

        const flushUl = (key) => {
          if (ulBuffer.length > 0) {
            elements.push(
              <ul key={`ul-${key}`} className="list-disc pl-5 mb-3 space-y-1.5 text-slate-800">
                {[...ulBuffer]}

            );

          let processed = line.trim();
          if (!processed) {
            flushUl(index);
            elements.push(<div key={`empty-${index}`} className="h-2" />);
            return;
          }

          processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong class="font-extrabold text-slate-900">$1</strong>');
          processed = processed.replace(/`(.*?)`/g, '<code class="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-mono text-xs font-semibold">$1</code>');

          if (line.startsWith('- ') || line.startsWith('* ')) {

                    {!isActionNA && (
                      <div className="mb-12">
                        <h3 className="text-sm md:text-base font-extrabold text-slate-900 border-b border-slate-200 pb-2 mb-4 uppercase tracking-wider flex items-center">
                          <span className="w-1 h-4 bg-indigo-600 rounded mr-2 inline-block"></span>
                          3. 향후 조치 및 추진계획
                        </h3>
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs border border-slate-200 border-collapse">
                            <thead>
                              <tr className="bg-slate-50 border-b border-slate-200">
                                <th className="px-3 py-2 w-[10%] text-center font-bold text-slate-700 border-r border-slate-200">순번</th>
                                <th className="px-3 py-2 w-[55%] text-left font-bold text-slate-700 border-r border-slate-200">추진 과제</th>
                                <th className="px-3 py-2 w-[18%] text-center font-bold text-slate-700 border-r border-slate-200">담당자</th>
                                <th className="px-3 py-2 w-[17%] text-center font-bold text-slate-700">기한</th>
                              </tr>
                            </thead>
                            <tbody>
                              {futureActions.map((act, idx) => (
                                <tr key={idx} className="border-b border-slate-200 hover:bg-slate-50/50">
                                  <td className="px-3 py-2 text-center border-r border-slate-200 font-bold text-slate-400">{idx + 1}</td>
                                  <td className="px-3 py-2 border-r border-slate-200 font-semibold">{act.task || '-'}</td>
                                  <td className="px-3 py-2 text-center border-r border-slate-200 font-semibold text-indigo-900">{act.owner || '-'}</td>
                                  <td className="px-3 py-2 text-center font-mono font-medium">{act.deadline || '-'}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* Signature block */}
                    {(showWrittenDate || !isSignaturesNA) && (
                      <div className="border-t border-slate-300 pt-8 mt-12 flex flex-col items-center w-full print-flex">
                        {/* Written Date */}
                        {showWrittenDate && writtenDate && (
                          <div className="text-sm text-slate-800 font-extrabold tracking-widest mb-6 text-center w-full">
                            {writtenDate}
                          </div>
                        )}
                        
                        {/* Chairperson & Secretary Signatures */}
                        {!isSignaturesNA && (
                          <div className="flex justify-center gap-16 mb-10 text-xs sm:text-sm font-bold w-full print-flex">
                            <div className="border-b border-slate-300 pb-1 w-44 text-center">
                              {formatChairpersonSignature(chairperson)}
                            </div>
                            <div className="border-b border-slate-300 pb-1 w-44 text-center">
                              {formatSecretarySignature(attendees)}
                            </div>
                          </div>
                        )}

                        {/* Attendee Signatures Grid */}
                        {!isSignaturesNA && attendeeSignatures && (
                          <div className="w-full max-w-2xl border-t border-dashed border-slate-200 pt-6">
                            <p className="text-[11px] text-slate-400 font-bold mb-5 text-center tracking-widest uppercase">참석위원 서명 및 날인</p>
                            <div className="grid grid-cols-5 gap-y-5 gap-x-6 px-2 print-grid">
                              {attendeeSignatures.split(',').map((item, idx) => {
                                const nameAndIn = item.trim();
                                if (!nameAndIn) return null;
                                return (
                                  <div key={idx} className="border-b border-slate-200 pb-1 h-8 flex items-end justify-center print-flex">
                                    <span className="text-xs font-semibold text-slate-850">{nameAndIn}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {/* AI EDITING CHAT WINDOW */}
                {rightTab === 'aiChat' && (
                  <div className="w-full max-w-[800px] bg-white border border-slate-200 rounded-2xl shadow-xl flex flex-col h-[650px] overflow-hidden no-print">
                    
                    <div className="p-4 bg-indigo-50/60 border-b border-slate-200 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <div className="p-1.5 bg-indigo-100 text-indigo-700 rounded-lg">
                          <Sparkles size={14} />
                        </div>
                        <div>
                          <h3 className="text-xs font-bold text-slate-800">실시간 회의록 밀착 교정 AI 비서</h3>
                          <p className="text-[9px] text-slate-500 leading-none mt-0.5">대화 맥락에 따라 문서를 부분 교정하거나 양식을 가다듬을 수 있습니다.</p>
                        </div>
                      </div>
                      <span className="text-[10px] font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">Gemini 2.5 Flash</span>
                    </div>

                    {/* Chat Messages */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
                      {chatLog.length === 0 ? (
                        <div className="text-center py-20 text-slate-400 flex flex-col items-center justify-center">
                          <Info size={24} className="text-slate-300 mb-2.5" />
                          <p className="text-xs font-bold">AI와 나눈 조율 기록이 아직 없습니다.</p>
                          <p className="text-[10px] text-slate-400 mt-1">먼저 '3. 녹취 발언' 탭에서 회의록을 생성한 뒤, 아래 입력창을 통해 교정 요청을 해보세요.</p>
                        </div>
                      ) : (
                        chatLog.map((chat, idx) => (
                          <div key={idx} className={`flex ${chat.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-[80%] rounded-2xl p-3.5 text-xs shadow-sm leading-relaxed ${
                              chat.role === 'user' 
                                ? 'bg-indigo-600 text-white rounded-tr-none' 
                                : chat.role === 'system'
                                  ? 'bg-emerald-50 border border-emerald-100 text-emerald-800 rounded-tl-none font-medium'
                                  : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none'
                            }`}>
                              {chat.text}
                            </div>
                          </div>
                        ))
                      )}
                      {isGenerating && (
                        <div className="flex justify-start">
                          <div className="bg-white border border-slate-200 text-slate-400 rounded-2xl rounded-tl-none p-3.5 text-xs flex items-center gap-2 shadow-sm font-medium">
                            <div className="w-3.5 h-3.5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                            AI 비서가 회의록을 수정하고 있습니다...
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Chat Input form */}
                    <form onSubmit={refineMinutesWithAI} className="p-3 border-t border-slate-200 bg-white flex gap-2">
                      <input
                        type="text"
                        value={refineQuery}
                        onChange={(e) => setRefineQuery(e.target.value)}
                        disabled={isGenerating || !generatedMinutes}
                        placeholder={
                          !generatedMinutes 
                            ? "회의록 생성 버튼을 먼저 눌러주세요." 
                            : "예: '결정사항 3번의 수치를 30%에서 20%로 수정해줘' 또는 '대화 톤을 더 부드럽게 바꿔줘'"
                        }
                        className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all font-medium disabled:bg-slate-100 disabled:text-slate-400"
                      />
                      <button
                        type="submit"
                        disabled={isGenerating || !refineQuery.trim() || !generatedMinutes}
                        className="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md transition-all shadow-indigo-600/10 active:scale-[0.97] disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none"
                      >
                        <Send size={15} />
                      </button>
                    </form>
                  </div>
                )}
              </div>
            </main>
          </div>

          {/* SETTINGS CONFIGURATION MODAL */}
          {showConfigModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
                      <Settings size={18} />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-800">스마트 회의록 환경 설정</h3>
                      <p className="text-[10px] text-slate-400">Gemini API 키 및 Firebase DB 연동 설정</p>
                    </div>
                  </div>
                  <button onClick={() => setShowConfigModal(false)} className="text-slate-400 hover:text-slate-600 p-1 text-sm font-bold">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1 flex items-center gap-1">
                      Gemini API Key (직접 호출 또는 Apps Script 사용 시 입력)
                    </label>
                    <input
                      type="password"
                      value={userGeminiApiKey}
                      onChange={(e) => setUserGeminiApiKey(e.target.value)}
                      placeholder="AI 호출을 위한 Gemini API Key를 입력하십시오."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all font-mono"
                    />
                    <p className="text-[10px] text-slate-400 mt-1 leading-normal">
                      ※ 직접 API 호출이나 Google Apps Script 중계 서비스를 사용할 때 API 키를 입력하십시오.
                    </p>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      API 우회 중계 주소 (Apps Script / Cloudflare Worker) (선택)
                    </label>
                    <input
                      type="text"
                      value={customWorkerUrl}
                      onChange={(e) => setCustomWorkerUrl(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all font-mono"
                    />
                    <p className="text-[10px] text-slate-400 mt-1 leading-normal">
                      ※ Google Apps Script 웹앱 URL이나 Cloudflare Worker 주소를 입력하여 교육청 방화벽 차단을 우회합니다.
                    </p>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      Firebase 연동 Config JSON (선택)
                    </label>
                    <textarea
                      value={customFbConfigString}
                      onChange={(e) => setCustomFbConfigString(e.target.value)}
                      placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "..."}'
                      rows="3"
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all font-mono"
                    ></textarea>
                    <p className="text-[10px] text-slate-400 mt-1 leading-normal">
                      ※ 클라우드 백업/동기화 기능을 커스텀 Firebase에 연결하고 싶을 때 복사 붙여넣기 하십시오. 비워둘 경우 기본 데모 모드로 작동합니다.
                    </p>
                  </div>
                </div>

                <div className="flex gap-2.5 justify-end mt-6">
                  <button onClick={() => setShowConfigModal(false)} className="px-4 py-2 border border-slate-250 text-slate-500 hover:bg-slate-50 rounded-xl text-xs font-bold transition-all">
                    취소
                  </button>
                  <button onClick={saveCustomSettings} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-600/10 transition-all">
                    설정 저장
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <div className="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-200 flex items-center justify-around px-4 z-40 shadow-lg no-print">
            <button 
              onClick={() => setMobileTab('edit')} 
              className={`flex flex-col items-center gap-1 px-4 py-1 rounded-xl transition-all ${
                mobileTab === 'edit' 
                  ? 'text-indigo-600 font-extrabold scale-105' 
                  : 'text-slate-400 hover:text-slate-600 font-medium'
              }`}
            >
              <FileText size={18} />
              <span className="text-[10px]">작성 / 설정</span>
            </button>
            <button 
              onClick={() => setMobileTab('preview')} 
              className={`flex flex-col items-center gap-1 px-4 py-1 rounded-xl transition-all ${
                mobileTab === 'preview' 
                  ? 'text-indigo-600 font-extrabold scale-105' 
                  : 'text-slate-400 hover:text-slate-600 font-medium'
              }`}
            >
              <Printer size={18} />
              <span className="text-[10px]">회의록 프리뷰</span>
            </button>
          </div>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
